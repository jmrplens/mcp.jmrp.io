sonar.organization=jmrplens
sonar.projectKey=jmrplens_mcp.jmrp.io
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.sourceEncoding=UTF-8

sonar.tests=tests

# `identity/` es un snapshot descargado, no código nuestro. `public/` son
# activos estáticos. El resto son artefactos de build y dependencias.
sonar.exclusions=dist/**,node_modules/**,**/*.d.ts,.scannerwork/**,.astro/**,identity/**,public/**

# ── Duplicación: los módulos de traducción no cuentan ─────────────────────
# `src/i18n/ui/*.ts` declara la MISMA estructura dos veces, una por idioma:
# ese es el formato de una tabla de traducción, no copia-pega que refactorizar.
# Sonar mide 11.2% de duplicación ahí y tumba el quality gate por un parecido
# que es el objetivo del fichero — y que un test de este repo EXIGE, porque
# comprueba que los dos idiomas expongan exactamente las mismas claves.
#
# Solo se excluye de la detección de duplicados: esos ficheros siguen
# analizándose para todo lo demás.
sonar.cpd.exclusions=src/i18n/ui/**

# No se mide cobertura: la garantía de este repo son los e2e contra el sitio
# desplegado y los tests de artefactos, no un porcentaje de líneas.
sonar.coverage.exclusions=**/*

# ── Exclusión justificada ──────────────────────────────────────────────────
# S6845 ("tabIndex solo en elementos interactivos") sobre el panel de salida
# del inspector.
#
# Ese <pre> es un contenedor con scroll propio: sin tabindex, quien navega con
# teclado no puede desplazarlo. Es la excepción reconocida en WCAG (SCR34) y lo
# que pide la guía de WAI-ARIA para regiones desplazables — Chrome lo hace
# enfocable solo cuando el contenido desborda, y Firefox y Safari nunca.
#
# Además, las dos reglas de Sonar se contradicen aquí: S6819 exige quitar el
# `role="region"` que la misma guía pide acompañando al tabindex. Obedecer a
# las dos es imposible; obedecer solo a S6845 empeora la accesibilidad real.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.e1.resourceKey=src/components/Inspector.tsx

# S6479 (no array index as a key) in the Markdown renderer. The rule guards
# lists that reorder or are edited in place, where a positional key makes
# Preact reuse the wrong node. Here the whole tree is re-parsed on every
# response and replaced wholesale: nothing is inserted, removed or moved
# within an existing list. A content-derived key would be worse, because a
# results table repeats cells ("cbr", "47 MB") and duplicate keys do break.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e2.resourceKey=src/components/Markdown.tsx

# S2925 (fixed waits in tests) in the request-brake e2e. The interval between
# clicks IS what that test measures: the limiter is defined in milliseconds, so
# no observable condition can stand in for the wait without measuring
# something else.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/e2e/inspector-ui.spec.ts
