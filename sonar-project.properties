sonar.organization=jmrplens
sonar.projectKey=jmrplens_mcp.jmrp.io
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.sourceEncoding=UTF-8

sonar.tests=tests

# `identity/` is a downloaded snapshot, not our code. `public/` is static
# assets. The rest are build artifacts and dependencies.
sonar.exclusions=dist/**,node_modules/**,**/*.d.ts,.scannerwork/**,.astro/**,identity/**,public/**

# ── Duplication: the translation modules do not count ─────────────────────
# `src/i18n/ui/*.ts` declares the SAME structure twice, once per language:
# that is the shape of a translation table, not copy-paste to refactor. Sonar
# measures 11.2% duplication there and fails the quality gate over a likeness
# that is the file's whole point — and that a test in this repo REQUIRES,
# because it checks that both languages expose exactly the same keys.
#
# `src/data/servers.ts` is the same shape one level down: every string in it
# is declared twice, once per language, and each tool, prompt and notice is a
# record with the same fixed keys as the one before it. Sonar reads the two
# servers' prompt arrays and their notices as a 55-line duplicated block,
# which is a fair description of a bilingual data table and a useless thing to
# refactor — the alternative is a builder that takes the text and returns the
# literal it already is. Adding a fourth notice to each server was enough to
# push it over the gate at 3.9%.
#
# Only duplicate detection is excluded: those files are still analyzed for
# everything else.
sonar.cpd.exclusions=src/i18n/ui/**,src/data/servers.ts

# Coverage is not measured: this repo's guarantee is the e2e suite against the
# deployed site and the artifact tests, not a percentage of lines.
sonar.coverage.exclusions=**/*

# ── Justified exclusions ───────────────────────────────────────────────────
# S6845 ("tabIndex only on interactive elements") on the inspector's output
# panel.
#
# That <pre> is a container with its own scroll: without tabindex, someone
# navigating by keyboard cannot scroll it. It is the exception WCAG recognizes
# (SCR34) and what the WAI-ARIA guidance asks for on scrollable regions —
# Chrome makes it focusable only when the content overflows, and Firefox and
# Safari never do.
#
# The two Sonar rules also contradict each other here: S6819 demands removing
# the `role="region"` that the same guidance asks for alongside the tabindex.
# Obeying both is impossible; obeying only S6845 makes real accessibility
# worse.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.e1.resourceKey=src/components/Inspector.tsx

# S6479 (no array index as a key) in the Markdown renderer. The rule guards
# lists that reorder or are edited in place, where a positional key makes
# Preact reuse the wrong node. Here the whole tree is re-parsed on every
# response and replaced wholesale: nothing is inserted, removed or moved
# within an existing list. A content-derived key would be worse, because a
# results table repeats cells ("cbr", "47 MB") and duplicate keys do break.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e2.resourceKey=src/components/Markdown.tsx

# S2925 (fixed waits in tests) in the request-brake e2e. The interval between
# clicks IS what that test measures: the limiter is defined in milliseconds, so
# no observable condition can stand in for the wait without measuring
# something else.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/e2e/inspector-ui.spec.ts
