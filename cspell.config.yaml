# CSpell Configuration — mcp.jmrp.io
# Bilingual spell checker (English + Spanish)
# Docs: https://cspell.org/configuration/

version: "0.2"
language: en

# Import Spanish dictionary
import:
  - "@cspell/dict-es-es/cspell-ext.json"

# Dictionaries to always enable
dictionaryDefinitions:
  - name: project-words
    path: ./cspell-project-words.txt
    addWords: true
    description: "Project-specific terms, names, and technical vocabulary"

dictionaries:
  - project-words
  - typescript
  - html
  - css
  - node
  - npm
  - bash
  - shellscript
  - fullstack
  - softwareTerms
  - networking-terms
  - en_us

# Additional words not in the project word list
# (for new terms, add directly to cspell-project-words.txt instead)
words: []

# Patterns to ignore (base64 strings, hashes, etc.)
ignoreRegExpList:
  - /[a-zA-Z0-9+/=]{20,}/g
  - /\b[0-9a-f]{32,}\b/gi
  - /nonce-[A-Za-z0-9+/=]+/g
  - /sha256-[A-Za-z0-9+/=]+/g
  - /sha384-[A-Za-z0-9+/=]+/g
  - /sha512-[A-Za-z0-9+/=]+/g

# Files and directories to skip entirely
ignorePaths:
  - node_modules
  - dist
  - dist_new
  - dist_old
  - builds
  - plan
  - .git
  - plan/** # gitignored working notes (Spanish prose), not part of the project
  # Untracked working notes, not repo prose. `git ls-files` returns nothing for
  # any of these: captured vhosts, audit reports and design specs kept beside
  # the code for reference. Spell-checking them says nothing about the project
  # and buries the code findings this check exists for — 18,799 issues, of
  # which the overwhelming majority were here.
  - ops/**
  - docs/superpowers/**
  - .superpowers/**
  - GEO-AUDIT-*.md
  - test-results/**
  - playwright-report/**
  - CHANGELOG-review.md # Spanish design-review report, not project content
  - design-audit/** # temporary generated screenshots + HTML for the design review
  - pnpm-lock.yaml
  - package-lock.json
  - "*.trie.gz"
  - "*.woff2"
  - "*.woff"
  - cv_latex/**
  - scripts/cv/** # LaTeX/ATS generator toolchain (LaTeX macros + Spanish template strings)
  - public/pdf/**
  - src/content/publications_data/papers.bib
  - schema-report.json
  - schema-report.html
  - html-validation.json
  - rss-validation.json
  - accessibility-report/**
  - skills-lock.json
  - accessibility-report.json
  - tools.yaml
  - lighthouse-results/**
  - playwright-report/**
  - test-results/**
  - screenshots-linkedin/**
  - AI_CONFIG_TASKS.md
  - AI_CONTEXT_ROADMAP.md
  - SEO_AUDIT.md
  - docs/I18N_PLAN.md
  - docs/I18N_RESEARCH.md
  - "*.tmLanguage.json"

# Per-path overrides
#
# The bilingual overrides jmrp.io carries here are gone: they named its own
# paths (`src/content/posts/es/**`, `src/content/cv/es.yaml`, the About/Uses/Now
# pages), none of which exist in this repo, so they matched nothing. Spanish is
# enabled globally above instead.
overrides:
  # The bilingual UI strings: every key here exists twice, once per language.
  - filename: "src/i18n/ui/*.ts"
    language: en,es
  # Server descriptions and notices, also written in both languages.
  - filename: "src/data/servers.ts"
    language: en,es
  # Generated from the live servers; the tool names and descriptions are the
  # binaries' own vocabulary, not prose this repo writes.
  - filename: "src/data/cards/*.json"
    enabled: false
