<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mcp.jmrp.io">
  <title>mcp.jmrp.io</title>
  <!-- The site's mark: the header's `~ ›` sigil, reduced to the chevron. At
       16 px any text would be illegible, so only the gesture is left. Its own
       opaque background (not transparent) so it reads the same in a light tab
       bar and in a dark one. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0b" />
  <path
    d="M9 10.5 15.5 16 9 21.5"
    fill="none"
    stroke="#f5a623"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M18 22h6" fill="none" stroke="#b6b5ae" stroke-width="2.75" stroke-linecap="round" />
</svg>
