# pnpm 11 no longer reads `package.json#pnpm`: the manager's configuration
# lives here.
#
# allowBuilds: pnpm blocks dependency install scripts by default. esbuild needs
# them to download its native binary; without this entry `pnpm install` warns
# with ERR_PNPM_IGNORED_BUILDS and the binary can end up not installed.
allowBuilds:
  esbuild: true
  # sonar-scanner downloads its own JRE + scanner binary on install; without
  # this it is skipped and `pnpm exec sonar-scanner` fails at run time.
  sonar-scanner: true
