name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push que cancela su propia ejecución anterior: en un repo de dos páginas
# no tiene sentido pagar dos runs por el mismo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar necesita el historial completo para atribuir la deuda a su
          # commit; con el clon superficial lo achaca todo al último.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--max-warnings=0` so CI and `pnpm verify` agree on what "clean" is;
      # without it a warning passes here and fails there.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Format (Prettier)
        run: pnpm exec prettier --check .

      - name: Styles (Stylelint)
        run: pnpm lint:css

      - name: Spelling (CSpell)
        run: pnpm spell

      - name: Markdown
        run: pnpm lint:md

      - name: JSDoc coverage
        run: node scripts/ci/calculate-jsdoc-coverage.mjs

      - name: Typecheck
        run: pnpm typecheck --minimumFailingSeverity warning

      # Antes del build: si el snapshot de la identidad está obsoleto, el build
      # lo usaría en silencio ante cualquier fallo de red y publicaría datos
      # viejos. Aquí se ve.
      - name: Identidad al día
        run: pnpm identity:check

      - name: Build
        run: pnpm build

      - name: Tests unitarios
        run: pnpm test:unit

      - name: Validar HTML
        run: npx html-validate dist

      # The last gate `pnpm verify` had that CI did not. The action runs lychee
      # directly, so it does its own globbing — `**` here is recursive, unlike
      # the same pattern handed to a shell without `globstar`.
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Broken links (Lychee)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los e2e llaman a los endpoints REALES en producción. En CI no se
      # ejecutan los que dependen de la red: un fallo del runner o un mirror
      # caído pondría el CI en rojo sin que nada de este repo esté mal.
      - name: Tests e2e
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e --workers=1
        env:
          E2E_NO_NETWORK: "1"

  sonar:
    runs-on: ubuntu-latest
    # Sin el secreto (por ejemplo en un fork) el análisis se salta en vez de
    # dejar el CI en rojo por algo que el autor del PR no puede arreglar.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
