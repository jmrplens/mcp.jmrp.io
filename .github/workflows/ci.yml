name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push cancels its own previous run: in a repo of a few pages there is no
# point paying for two runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs the full history to attribute debt to its own commit;
          # with a shallow clone it blames everything on the last one.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--max-warnings=0` so CI and `pnpm verify` agree on what "clean" is;
      # without it a warning passes here and fails there.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Format (Prettier)
        run: pnpm exec prettier --check .

      - name: Styles (Stylelint)
        run: pnpm lint:css

      - name: Spelling (CSpell)
        run: pnpm spell

      - name: Markdown
        run: pnpm lint:md

      - name: JSDoc coverage
        run: node scripts/ci/calculate-jsdoc-coverage.mjs

      - name: Typecheck
        run: pnpm typecheck --minimumFailingSeverity warning

      # Before the build: if the identity snapshot is stale, the build would
      # silently use it on any network failure and publish old data. Here it is
      # visible.
      - name: Identity up to date
        run: pnpm identity:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate HTML
        run: npx html-validate dist

      # The last gate `pnpm verify` had that CI did not. The action runs lychee
      # directly, so it does its own globbing — `**` here is recursive, unlike
      # the same pattern handed to a shell without `globstar`.
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Broken links (Lychee)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The e2e suite calls the REAL endpoints in production. In CI the ones
      # that depend on the network are not run: a runner failure or a mirror
      # being down would turn CI red with nothing in this repo being wrong.
      - name: E2E tests
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e --workers=1
        env:
          E2E_NO_NETWORK: "1"

  sonar:
    runs-on: ubuntu-latest
    # Without the secret (in a fork, for instance) the analysis is skipped
    # rather than leaving CI red over something the PR's author cannot fix.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
